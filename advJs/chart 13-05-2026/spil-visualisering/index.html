<!doctype html>
<html lang="en">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <title>spil-visualisering</title>

<body>
  <h1>Spil 1995–2019</h1>
  <input type="file" id="fileInput" accept=".xlsx" />
